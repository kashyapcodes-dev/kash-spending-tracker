name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # API and end-to-end tests run against a real Postgres (see docker/compose.dev.yml for local use).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kash
          POSTGRES_PASSWORD: kash
          POSTGRES_DB: kash
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U kash" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      # Non-blocking report (M9): known-vulnerable dependencies.
      - run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm build
      - run: pnpm --filter @kash/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  docker-build:
    # Builds the image on every pull request without pushing (M2-D-10 covers arm64), then runs
    # the container acceptance tests against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 and arm64 (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image for the container tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kash:ci
          cache-from: type=gha
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kash/web exec playwright install --with-deps chromium
      - name: Container tests (M2-D-1 to M2-D-9)
        run: KASH_IMAGE=kash:ci SKIP_BUILD=1 docker/test/run.sh
